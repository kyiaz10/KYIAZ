<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORBIT — цифровая вселенная задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ORBIT — design tokens (сохранено из исходного дизайна)
   ============================================================ */
:root{
  --bg-0:#05060a;
  --bg-1:#0a0c17;
  --bg-2:#0e0b1c;
  --violet:#3a2d66;
  --glass:rgba(255,255,255,.045);
  --glass-strong:rgba(255,255,255,.075);
  --glass-border:rgba(255,255,255,.09);
  --text-1:#eef0f7;
  --text-2:#9aa1b8;
  --text-3:#5e6478;
  --red:#ff5d5d;
  --red-glow:rgba(255,93,93,.45);
  --amber:#ffb454;
  --amber-glow:rgba(255,180,84,.4);
  --emerald:#34d399;
  --emerald-glow:rgba(52,211,153,.4);
  --sky:#5ac8fa;
  --sky-glow:rgba(90,200,250,.4);
  --slate:#6b7280;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:9px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.16,1,.3,1);
  --dur-fast:.18s;
  --dur-med:.42s;
  --dur-slow:.9s;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse 90% 60% at 15% -10%, #1c1440 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 0%, #0f1f3d 0%, transparent 50%),
    radial-gradient(ellipse 80% 80% at 50% 120%, #150f2e 0%, transparent 60%),
    var(--bg-0);
  color:var(--text-1);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  height:100vh;
  width:100vw;
}
.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

::selection{background:rgba(90,140,255,.35);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);}

button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; color:inherit;}
a{color:inherit;}

/* ============================================================ Loader ============================================================ */
#loader{
  position:fixed; inset:0; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg-0);
  transition:opacity .9s var(--ease), filter .9s var(--ease);
}
#loader.hide{opacity:0; filter:blur(12px); pointer-events:none;}
.loader-mark{display:flex; gap:2px; font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:var(--text-2); margin-bottom:28px;}
.loader-mark span{opacity:0; transform:translateY(10px); animation:letterIn .7s var(--ease-soft) forwards;}
.loader-orbit{position:relative; width:64px; height:64px; margin-bottom:26px;}
.loader-orbit .ring{position:absolute; inset:0; border-radius:50%; border:1px solid rgba(255,255,255,.12); border-top-color:var(--sky); animation:spin 1.4s linear infinite;}
.loader-orbit .ring:nth-child(2){inset:12px; border-top-color:var(--amber); animation-duration:1s; animation-direction:reverse;}
.loader-orbit .dot{position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--sky); box-shadow:0 0 12px 2px var(--sky-glow);}
.loader-status{font-size:12px; color:var(--text-3); letter-spacing:.08em; min-height:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes letterIn{to{opacity:1; transform:translateY(0);}}

/* ============================================================ Login screen ============================================================ */
#loginScreen{
  position:fixed; inset:0; z-index:8000; display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .6s var(--ease-soft);
}
#loginScreen.show{opacity:1; pointer-events:all;}
.login-lang-switch{position:absolute; top:20px; right:20px; z-index:8001;}
.login-card{
  position:relative;
  width:400px; max-width:100%; padding:34px 30px 28px; border-radius:24px; text-align:center;
  background:linear-gradient(165deg, rgba(20,20,32,.86), rgba(10,10,18,.9));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 50px 100px -30px rgba(0,0,0,.9);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
.login-step{display:none;}
.login-step.active{display:block; animation:loginStepIn .45s var(--ease-soft);}
@keyframes loginStepIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.login-glyph{width:52px; height:52px; margin:0 auto 18px; border-radius:50%; background:conic-gradient(from 120deg, var(--sky), var(--violet), var(--amber), var(--sky)); box-shadow:0 0 30px 4px rgba(90,150,255,.35);}
.login-title{font-size:21px; font-weight:600; margin-bottom:8px;}
.login-sub{font-size:13px; color:var(--text-2); line-height:1.55; margin-bottom:22px;}
.login-card .text-input{margin-bottom:12px; text-align:center;}
.login-error{font-size:12px; color:var(--red); min-height:16px; margin-bottom:6px;}
.login-debug{display:block; margin-top:16px; font-size:11.5px; color:var(--text-3); text-decoration:underline; text-underline-offset:3px;}
.login-debug:hover{color:var(--text-2);}
.login-back{position:absolute; top:16px; left:16px; color:var(--text-3); width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; transition:all .18s var(--ease);}
.login-back:hover{color:var(--text-1); background:rgba(255,255,255,.06);}
.login-back svg{width:16px; height:16px;}

/* language switcher (pill toggle, used on login screen and topbar) */
.lang-switch{display:flex; align-items:center; padding:3px; border-radius:20px; background:rgba(255,255,255,.05); border:1px solid var(--glass-border); gap:2px;}
.lang-switch button{font-size:11px; font-weight:600; letter-spacing:.03em; padding:5px 10px; border-radius:16px; color:var(--text-3); transition:all .2s var(--ease);}
.lang-switch button.on{background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); color:var(--text-1); box-shadow:0 1px 0 rgba(255,255,255,.1) inset;}

/* phone input: country select + number field */
.phone-field{display:flex; gap:8px; margin-bottom:12px;}
.country-select-wrap{position:relative; flex:0 0 auto;}
.country-select-btn{
  display:flex; align-items:center; gap:6px; height:100%; padding:10px 10px; border-radius:11px;
  background:rgba(255,255,255,.045); border:1px solid var(--glass-border); font-size:13px; color:var(--text-1);
  white-space:nowrap; transition:border-color .2s, background .2s;
}
.country-select-btn:hover{background:rgba(255,255,255,.065);}
.country-select-btn svg{width:11px; height:11px; color:var(--text-3); flex:0 0 auto;}
.country-dropdown{
  position:absolute; top:calc(100% + 6px); left:0; z-index:20; width:240px; max-height:260px; overflow-y:auto;
  border-radius:14px; padding:6px; text-align:left;
  background:linear-gradient(165deg, rgba(24,24,36,.97), rgba(14,14,22,.98));
  border:1px solid rgba(255,255,255,.1); box-shadow:0 30px 60px -20px rgba(0,0,0,.9);
  opacity:0; transform:translateY(-6px) scale(.97); pointer-events:none; transition:all .18s var(--ease);
}
.country-dropdown.show{opacity:1; transform:translateY(0) scale(1); pointer-events:all;}
.country-opt{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px; border-radius:9px; font-size:12.5px; color:var(--text-2); transition:background .15s, color .15s;}
.country-opt:hover{background:rgba(255,255,255,.06); color:var(--text-1);}
.country-opt .code{color:var(--text-3); font-variant-numeric:tabular-nums;}
.phone-field input{flex:1; min-width:0; text-align:left;}

/* SMS code entry */
.code-inputs{display:flex; gap:10px; justify-content:center; margin-bottom:14px;}
.code-inputs input{
  width:52px; height:58px; text-align:center; font-size:22px; font-weight:600; font-family:'Space Grotesk',sans-serif;
  background:rgba(255,255,255,.045); border:1px solid var(--glass-border); border-radius:13px; color:var(--text-1); outline:none;
  transition:border-color .2s, background .2s, transform .15s;
}
.code-inputs input:focus{border-color:rgba(140,160,255,.55); background:rgba(255,255,255,.07); transform:translateY(-1px);}
.code-inputs input.err{border-color:rgba(255,93,93,.6); animation:codeShake .35s;}
@keyframes codeShake{20%{transform:translateX(-5px);} 40%{transform:translateX(5px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} 100%{transform:translateX(0);}}
.login-hint-num{color:var(--text-1); font-weight:600;}

/* ============================================================ App shell ============================================================ */
#app{height:100vh; width:100vw; display:flex; flex-direction:column; opacity:0; transition:opacity .8s var(--ease-soft); pointer-events:none;}
#app.ready{opacity:1; pointer-events:all;}

.topbar{
  height:58px; flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:0 16px; border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(8,9,16,.55); backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:relative; z-index:40;
}
.brand{display:flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; letter-spacing:.02em; flex:0 0 auto;}
.brand-glyph{width:20px; height:20px; border-radius:50%; background:conic-gradient(from 120deg, var(--sky), var(--violet), var(--amber), var(--sky)); box-shadow:0 0 14px 1px rgba(90,150,255,.5); flex:0 0 auto;}
.btn-menu{display:none; flex:0 0 auto;}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex; align-items:center; gap:8px;}

.user-pill{
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); padding:7px 12px 7px 10px;
  border-radius:20px; background:rgba(255,255,255,.04); border:1px solid var(--glass-border); cursor:pointer;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.user-pill:hover{background:rgba(255,255,255,.07); color:var(--text-1);}
.user-pill span.uid{color:var(--text-1); font-weight:500;}

.btn{
  display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
  padding:8px 14px; border-radius:11px; color:var(--text-1);
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 6px 18px -10px rgba(0,0,0,.6);
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), filter var(--dur-fast);
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px); filter:brightness(1.12); box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 10px 24px -10px rgba(0,0,0,.7);}
.btn:active{transform:translateY(0) scale(.97); transition-duration:.08s;}
.btn.primary{background:linear-gradient(180deg, #6f8cff, #4a63e8); border-color:rgba(140,160,255,.5); box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 8px 22px -8px rgba(80,100,240,.65);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none; color:var(--text-2);}
.btn.ghost:hover{background:rgba(255,255,255,.06); color:var(--text-1);}
.btn.danger{color:var(--red);}
.btn.danger:hover{background:rgba(255,93,93,.1);}
.btn.icon{padding:8px; width:34px; height:34px; justify-content:center;}
.btn.block{width:100%; justify-content:center;}
.btn svg{width:15px; height:15px; flex:0 0 auto;}
.btn:disabled{opacity:.5; pointer-events:none;}

.body-row{flex:1; display:flex; min-height:0; position:relative;}

/* ---- Sidebar left ---- */
.sidebar-left{
  width:238px; flex:0 0 auto; border-right:1px solid rgba(255,255,255,.06);
  background:rgba(6,7,13,.4); backdrop-filter:blur(16px);
  padding:18px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:22px;
  transition:transform .45s var(--ease-soft);
}
.side-group-title{display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-3); padding:0 8px 8px; font-weight:600;}
.side-group-title .add-cat-btn{
  margin-left:auto; width:19px; height:19px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  color:var(--text-3); background:rgba(255,255,255,.05); border:1px solid var(--glass-border);
  transition:all .18s var(--ease);
}
.side-group-title .add-cat-btn:hover{color:var(--text-1); background:rgba(255,255,255,.1); transform:scale(1.08);}
.side-group-title .add-cat-btn svg{width:11px; height:11px;}
.side-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; font-size:13px; color:var(--text-2);
  cursor:pointer; transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  position:relative;
}
.side-item:hover{background:rgba(255,255,255,.05); color:var(--text-1);}
.side-item.active{background:rgba(255,255,255,.08); color:var(--text-1);}
.side-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 8px 1px currentColor;}
.side-item .count{margin-left:auto; font-size:11px; color:var(--text-3); background:rgba(255,255,255,.05); padding:1px 7px; border-radius:20px;}
.side-item.active .count{color:var(--text-2);}
.side-item .cat-del{opacity:0; color:var(--text-3); width:16px; height:16px; display:flex; align-items:center; justify-content:center; border-radius:5px; transition:opacity .15s, color .15s, background .15s;}
.side-item:hover .cat-del{opacity:1;}
.side-item .cat-del:hover{color:var(--red); background:rgba(255,93,93,.12);}
.side-item .cat-del svg{width:11px; height:11px;}
.side-empty-hint{font-size:11.5px; color:var(--text-3); padding:6px 10px; line-height:1.5;}

/* ---- Main view ---- */
.main-view{flex:1; min-width:0; overflow-y:auto; position:relative; padding:26px 30px 60px;}

.view-header{margin-bottom:22px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.view-title{font-size:27px; font-weight:600; display:flex; gap:2px; perspective:600px;}
.view-title span{display:inline-block; opacity:0; transform:translateY(14px) rotateX(-40deg); animation:titleIn .7s var(--ease-soft) forwards; text-shadow:0 2px 24px rgba(120,150,255,.25);}
@keyframes titleIn{to{opacity:1; transform:translateY(0) rotateX(0);}}
.view-sub{color:var(--text-3); font-size:12.5px; margin-top:5px;}

.toolbar-row{display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.search-wrap{position:relative; flex:1 1 200px; max-width:320px;}
.search-wrap input{
  width:100%; font-size:13px; padding:9px 12px 9px 34px; border-radius:11px; background:rgba(255,255,255,.04);
  border:1px solid var(--glass-border); color:var(--text-1); transition:border-color var(--dur-fast), background var(--dur-fast);
}
.search-wrap input:focus{outline:none; border-color:rgba(140,160,255,.5); background:rgba(255,255,255,.06);}
.search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-3); pointer-events:none;}

/* ---- Productivity donut card ---- */
.donut-card{
  border-radius:var(--r-lg); padding:24px 26px; margin-bottom:26px;
  background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  border:1px solid var(--glass-border);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 20px 50px -30px rgba(0,0,0,.8);
  display:flex; align-items:center; gap:32px; flex-wrap:wrap;
}
.donut-card-title{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text-2); margin-bottom:4px;}
.donut-card-sub{font-size:11.5px; color:var(--text-3);}
.donut-svg-wrap{position:relative; width:172px; height:172px; flex:0 0 auto;}
.donut-svg-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
.donut-seg{fill:none; stroke-width:22; stroke-linecap:round; transition:stroke-dasharray 1.1s var(--ease-soft);}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;}
.donut-center .n{font-size:30px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.donut-center .l{font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
.donut-legend{display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; flex:1; min-width:220px;}
.donut-legend-row{display:flex; align-items:center; gap:9px;}
.donut-legend-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 8px 1px currentColor;}
.donut-legend-txt{display:flex; flex-direction:column; gap:1px;}
.donut-legend-txt .lbl{font-size:12.5px; color:var(--text-1); font-weight:500;}
.donut-legend-txt .nums{font-size:11px; color:var(--text-3);}
.donut-legend-txt .nums b{color:var(--text-2); font-weight:600;}

/* ---- Cards grid ---- */
.tasks-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;}

.task-card{
  position:relative; border-radius:var(--r-md); padding:14px 15px 13px;
  background:linear-gradient(155deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 14px 34px -22px rgba(0,0,0,.8);
  cursor:pointer; opacity:0; transform:translateY(10px) scale(.98);
  animation:cardIn .5s var(--ease-soft) forwards;
  transition:transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.task-card:hover{transform:translateY(-3px); border-color:rgba(255,255,255,.18); box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 20px 40px -18px rgba(0,0,0,.85);}
.task-card:active{transform:translateY(-1px) scale(.99); transition-duration:.08s;}
.task-card.removing{animation:cardOut .32s var(--ease) forwards;}
@keyframes cardIn{to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes cardOut{to{opacity:0; transform:scale(.9);}}
.task-card::before{
  content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
  background:linear-gradient(140deg, var(--pri-glow, transparent), transparent 40%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; opacity:.8;
}
.task-card.pri-high{--pri-glow:rgba(255,93,93,.55);}
.task-card.pri-medium{--pri-glow:rgba(255,180,84,.5);}
.task-card.pri-low{--pri-glow:rgba(90,200,250,.5);}
.task-card.is-done{filter:saturate(.7); opacity:.72;}

.tc-top{display:flex; align-items:flex-start; gap:9px; margin-bottom:9px;}
.tc-check{width:19px; height:19px; border-radius:7px; border:1.5px solid rgba(255,255,255,.25); flex:0 0 auto; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .25s var(--ease);}
.tc-check.on{background:linear-gradient(160deg,#6fe3b0,#34d399); border-color:transparent;}
.tc-check svg{width:11px; height:11px; color:#04241a; opacity:0; transform:scale(.5); transition:all .18s;}
.tc-check.on svg{opacity:1; transform:scale(1);}
.tc-title{font-size:14px; font-weight:600; line-height:1.4; flex:1; word-break:break-word;}
.task-card.is-done .tc-title{text-decoration:line-through; color:var(--text-3);}
.tc-fav{color:var(--text-3); flex:0 0 auto; transition:color .2s, transform .2s;}
.tc-fav.on{color:var(--amber); transform:scale(1.1);}
.tc-fav svg{width:14px; height:14px;}
.tc-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px;}
.badge{font-size:10.5px; padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:4px; color:var(--text-2); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06);}
.badge .d{width:6px; height:6px; border-radius:50%; box-shadow:0 0 6px currentColor;}
.tc-footer{display:flex; align-items:center; justify-content:space-between; margin-top:11px; padding-top:9px; border-top:1px solid rgba(255,255,255,.05);}
.tc-time{font-size:10.5px; color:var(--text-3);}
.tc-del{color:var(--text-3); opacity:0; transition:opacity .15s, color .15s;}
.task-card:hover .tc-del{opacity:1;}
.tc-del:hover{color:var(--red);}
.tc-del svg{width:13px; height:13px;}

/* ---- empty state ---- */

}
.modal-backdrop.show{opacity:1; pointer-events:all;}
.modal-card{

}

.modal-title{font-size:17px; font-weight:600; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:10px;}

.text-input{width:100%; background:rgba(255,255,255,.045); border:1px solid var(--glass-border); border-radius:11px; padding:10px 13px; font-size:13.5px; outline:none; transition:border-color .2s, background .2s;}

.select-field{width:100%; background:rgba(255,255,255,.04); border:1px solid var(--glass-border); border-radius:11px; padding:10px 13px; font-size:13px; outline:none; appearance:none; cursor:pointer;

.select-field option{background:#12131c; color:var(--text-1);}
.segmented{display:flex; background:rgba(255,255,255,.04); border:1px solid var(--glass-border); border-radius:11px; padding:3px; gap:3px;}
.segmented button{flex:1; padding:8px 0; font-size:12px; border-radius:8px; color:var(--text-2); display:flex; align-items:center; justify-content:center; gap:5px; transition:all .2s var(--ease);}
.segmented button .d{width:6px; height:6px; border-radius:50%; box-shadow:0 0 6px currentColor;}
.segmented button.on{background:rgba(255,255,255,.09); color:var(--text-1); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;}
.modal-footer{display:flex; justify-content:flex-end; gap:9px; margin-top:8px; flex-wrap:wrap;}
.modal-footer .push-left{margin-right:auto;}

/* ============================================================ Toasts ============================================================ */
#toasts{position:fixed; top:70px; right:20px; z-index:5000; display:flex; flex-direction:column; gap:8px; align-items:flex-end; max-width:calc(100vw - 40px);}
.toast{
  display:flex; align-items:center; gap:9px; padding:11px 15px; border-radius:13px; font-size:12.5px;
  background:linear-gradient(160deg, rgba(24,24,36,.92), rgba(14,14,22,.94)); border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 40px -18px rgba(0,0,0,.8);
  transform:translateX(20px) scale(.96); opacity:0; animation:toastIn .45s var(--ease-soft) forwards;
}
.toast.out{animation:toastOut .35s var(--ease) forwards;}
@keyframes toastIn{to{transform:translateX(0) scale(1); opacity:1;}}
@keyframes toastOut{to{transform:translateX(20px) scale(.95); opacity:0;}}
.toast .dot{width:7px; height:7px; border-radius:50%; box-shadow:0 0 8px currentColor; flex:0 0 auto;}

@media (max-width: 860px){

    'empty.none': 'No tasks yet. Click “New task” to create your first one.',
    'time.now': 'just now',
    'time.minAgo': '{n}m ago',
    'time.hAgo': '{n}h ago',
    'time.daysAgo': '{n}d ago',
    'loader.step1': 'Booting core…',
    'loader.step2': 'Loading local data…',
    'loader.step3': 'Setting up interface…',
    'loader.step4': 'Almost ready…',
  }
};

let currentLang = localStorage.getItem(LANG_KEY) || 'ru';

function t(key, vars){
  const dict = I18N[currentLang] || I18N.ru;
  let str = dict[key] != null ? dict[key] : (I18N.ru[key] != null ? I18N.ru[key] : key);
  if(vars){ Object.keys(vars).forEach(k => { str = str.replace('{'+k+'}', vars[k]); }); }
  return str;
}

function applyStaticI18n(){
  document.documentElement.lang = currentLang;
  $$('[data-i18n]').forEach(node => { node.textContent = t(node.getAttribute('data-i18n')); });
  $$('[data-i18n-ph]').forEach(node => { node.setAttribute('placeholder', t(node.getAttribute('data-i18n-ph'))); });
  $$('[data-i18n-title]').forEach(node => { node.setAttribute('title', t(node.getAttribute('data-i18n-title'))); });
  $$('.lang-switch').forEach(sw => {
    $$('button', sw).forEach(b => b.classList.toggle('on', b.dataset.lang === currentLang));
  });
}

function setLang(lang){
  if(lang !== 'ru' && lang !== 'en') return;
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  applyStaticI18n();
  refreshCountrySelectLabel();
  buildCountryDropdown();
  if(State.userPhone){ renderAll(); }
}

/* ---------------------------------------------------------------------------
   2. Утилиты
--------------------------------------------------------------------------- */
const $  = (sel, ctx) => (ctx||document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx||document).querySelectorAll(sel));
function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function letters(word){ return word.split('').map((c,i)=>`<span style="animation-delay:${i*55}ms">${c}</span>`).join(''); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function categoryColor(id){ return CATEGORY_PALETTE[Math.abs(Number(id)||0) % CATEGORY_PALETTE.length]; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function timeAgo(iso){
  if(!iso) return '';
  const d = new Date(iso).getTime();
  if(isNaN(d)) return '';
  const diff = Math.max(0, Date.now() - d);
  const m = Math.floor(diff/60000);
  if(m < 1) return t('time.now');
  if(m < 60) return t('time.minAgo', {n:m});
  const h = Math.floor(m/60);
  if(h < 24) return t('time.hAgo', {n:h});
  const days = Math.floor(h/24);
  return t('time.daysAgo', {n:days});
}
function isToday(iso){
  if(!iso) return false;
  const d = new Date(iso);
  const now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

/* ---------------------------------------------------------------------------
   3. Toasts
--------------------------------------------------------------------------- */
function toast(msg, type){
  const colors = {ok:'var(--emerald)', warn:'var(--amber)', err:'var(--red)'};
  const el_ = el('div','toast');
  el_.innerHTML = `<span class="dot" style="background:${colors[type]||colors.ok};color:${colors[type]||colors.ok}"></span><span>${escapeHtml(msg)}</span>`;
  $('#toasts').appendChild(el_);
  setTimeout(()=>{ el_.classList.add('out'); setTimeout(()=>el_.remove(), 380); }, 2600);
}

--------------------------------------------------------------------------- */
const State = {
  userPhone: null,   // например "+996700123456"
  categories: [],
  tasks: [],
};
const UIState = {
  favOnly: false,
  priorities: new Set(),

/* ---------------------------------------------------------------------------
   5. Слой хранения — всё живёт в LocalStorage, ключи привязаны к номеру телефона
--------------------------------------------------------------------------- */
function userDataKey(phone){ return STORAGE_PREFIX + 'data_' + phone; }

function loadUserData(phone){
  try{
    const raw = localStorage.getItem(userDataKey(phone));
    if(raw){
      const parsed = JSON.parse(raw);
      return {categories: parsed.categories || [], tasks: parsed.tasks || []};
    }
  }catch(e){ /* повреждённые данные — начинаем с чистого листа */ }
  return {categories: [], tasks: []};
}
function saveUserData(){
  try{
    localStorage.setItem(userDataKey(State.userPhone), JSON.stringify({
      categories: State.categories, tasks: State.tasks,
    }));
  }catch(e){
    toast('Storage error', 'err');
  }
}
function getKnownUsers(){
  try{ return JSON.parse(localStorage.getItem(KNOWN_USERS_KEY) || '[]'); }catch(e){ return []; }
}
function rememberKnownUser(phone){
  const known = getKnownUsers();
  if(!known.includes(phone)){ known.push(phone); localStorage.setItem(KNOWN_USERS_KEY, JSON.stringify(known)); }
}

/* ---------------------------------------------------------------------------
   6. Авторизация по номеру телефона (имитация SMS)
--------------------------------------------------------------------------- */
let selectedCountry = COUNTRIES[0];
let pendingPhone = null; // полный номер, ожидающий подтверждения кодом

function refreshCountrySelectLabel(){
  $('#countrySelectFlag').textContent = selectedCountry.flag;
  $('#countrySelectCode').textContent = selectedCountry.code;
}
function buildCountryDropdown(){
  const dd = $('#countryDropdown'); dd.innerHTML = '';
  COUNTRIES.forEach(c=>{
    const name = currentLang==='en' ? c.nameEn : c.name;
    const opt = el('div','country-opt');
    opt.innerHTML = `<span>${c.flag} ${escapeHtml(name)}</span><span class="code">${c.code}</span>`;
    opt.onclick = () => { selectedCountry = c; refreshCountrySelectLabel(); dd.classList.remove('show'); $('#phoneInput').focus(); };
    dd.appendChild(opt);
  });
}
function normalizePhone(raw, country){
  const digits = String(raw||'').replace(/\D/g,'');
  if(!digits) return null;
  const codeDigits = country.code.replace(/\D/g,'');
  return '+' + codeDigits + digits;
}

async function boot(){
  $('#loaderMark').innerHTML = letters('ORBIT');
  const statusEl = $('#loaderStatus');
  const steps = [t('loader.step1'), t('loader.step2'), t('loader.step3'), t('loader.step4')];
  for(const step of steps){ statusEl.textContent = step; await wait(160); }

  buildCountryDropdown();
  refreshCountrySelectLabel();
  applyStaticI18n();
  wireStaticEvents();

  document.getElementById('loader').classList.add('hide');
  setTimeout(()=>{ const l = document.getElementById('loader'); if(l) l.remove(); }, 950);

  const savedPhone = localStorage.getItem(SESSION_KEY);
  if(savedPhone){
    signIn(savedPhone, {silent:true});
  }else{
    showLogin();
  }
}

function showLogin(){
  $('#loginScreen').classList.add('show');
  $('#loginStepPhone').classList.add('active');
  $('#loginStepCode').classList.remove('active');
  setTimeout(()=>$('#phoneInput').focus(), 60);
}

function goToCodeStep(){
  $('#loginStepPhone').classList.remove('active');
  $('#loginStepCode').classList.add('active');
  $('#codeTargetNumber').textContent = pendingPhone;
  $('#loginErrorCode').textContent = '';
  const inputs = $$('#codeInputs input');
  inputs.forEach(i => { i.value=''; i.classList.remove('err'); });
  setTimeout(()=>inputs[0].focus(), 60);
}

function submitPhoneStep(){
  const raw = $('#phoneInput').value.trim();
  const errEl = $('#loginErrorPhone');
  errEl.textContent = '';
  const phone = normalizePhone(raw, selectedCountry);
  if(!phone || phone.replace(/\D/g,'').length < 6){
    errEl.textContent = t('login.errPhone');
    return;
  }
  pendingPhone = phone;
  goToCodeStep();
}

function collectCode(){ return $$('#codeInputs input').map(i=>i.value).join(''); }

function submitCodeStep(){
  const code = collectCode();
  const errEl = $('#loginErrorCode');
  if(code.length < 4){ errEl.textContent = t('login.errCode'); return; }
  if(code !== DEMO_CODE){
    errEl.textContent = t('login.errCode');
    $$('#codeInputs input').forEach(i => { i.classList.add('err'); setTimeout(()=>i.classList.remove('err'), 400); });
    return;
  }
  errEl.textContent = '';
  const isNew = !getKnownUsers().includes(pendingPhone);
  rememberKnownUser(pendingPhone);
  localStorage.setItem(SESSION_KEY, pendingPhone);
  signIn(pendingPhone, {silent:false, isNew});
}

function signIn(phone, opts){
  opts = opts || {};
  State.userPhone = phone;
  const data = loadUserData(phone);
  State.categories = data.categories;
  State.tasks = data.tasks;
  $('#userIdLabel').textContent = phone;
  $('#loginScreen').classList.remove('show');
  $('#app').classList.add('ready');
  renderAll();
  if(!opts.silent){
    toast(t('login.welcomeBack'), 'ok');
  }
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  State.userPhone = null; State.categories = []; State.tasks = [];
  UIState.favOnly = false; UIState.priorities.clear(); UIState.categoryId = null; UIState.search = '';
  $('#app').classList.remove('ready');
  $('#phoneInput').value = '';
  pendingPhone = null;
  showLogin();
}

/* ---------------------------------------------------------------------------
   7. Фильтрация и общий рендер
--------------------------------------------------------------------------- */
function getFilteredTasks(){
  let list = State.tasks.slice();
  if(UIState.favOnly) list = list.filter(t => t.is_favorite);
  if(UIState.priorities.size) list = list.filter(t => UIState.priorities.has(t.priority));
  if(UIState.categoryId != null) list = list.filter(t => t.category_id === UIState.categoryId);
  if(UIState.search.trim()){
    const q = UIState.search.trim().toLowerCase();
    list = list.filter(t => t.text.toLowerCase().includes(q));
  }
  return list;
}

function renderAll(){
  applyStaticI18n();
  renderSidebar();
  renderMain();
}

function renderSidebar(){
  $('#cntAll').textContent = State.tasks.length;
  $('#cntFav').textContent = State.tasks.filter(t=>t.is_favorite).length;
  $('#allTasksNav').classList.toggle('active', !UIState.favOnly && !UIState.priorities.size && UIState.categoryId==null);
  $('#favNav').classList.toggle('active', UIState.favOnly);

  const pf = $('#priorityFilters'); pf.innerHTML = '';
  PRIORITY_DEFS.forEach(p=>{

    item.innerHTML = `<span class="side-dot" style="background:${p.color};color:${p.color}"></span>${t(p.labelKey)}<span class="count">${count}</span>`;
    item.onclick = () => { UIState.priorities.has(p.id) ? UIState.priorities.delete(p.id) : UIState.priorities.add(p.id); renderAll(); };
    pf.appendChild(item);
  });

  const cf = $('#categoryFilters'); cf.innerHTML = '';
  if(!State.categories.length){
    const hint = el('div','side-empty-hint');
    hint.textContent = t('category.addHint');
    cf.appendChild(hint);
  }
  State.categories.forEach(c=>{
    const count = State.tasks.filter(t=>t.category_id===c.id && !t.completed).length;
    const color = categoryColor(c.id);
    const item = el('div','side-item'+(UIState.categoryId===c.id?' active':''));
    item.innerHTML = `<span class="side-dot" style="background:${color};color:${color}"></span>${escapeHtml(c.name)}<span class="count">${count}</span><span class="cat-del" title="${escapeHtml(t('common.delete'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></span>`;
    item.onclick = (e) => {

    cf.appendChild(item);
  });

/* ---------------------------------------------------------------------------
   9. Круговой график продуктивности — 4 равных сектора по 25%
--------------------------------------------------------------------------- */
function buildDonutCard(){
  const wrap = el('div','donut-card');

  const groups = [
    {key:'high',   label:t('priority.highLabel'),   color:'var(--red)',     colorHex:'#ff5d5d',
      total: State.tasks.filter(x=>x.priority==='high' && !x.completed).length,
      today: State.tasks.filter(x=>x.priority==='high' && !x.completed && isToday(x.created_at)).length},
    {key:'medium', label:t('priority.mediumLabel'), color:'var(--amber)',   colorHex:'#ffb454',
      total: State.tasks.filter(x=>x.priority==='medium' && !x.completed).length,
      today: State.tasks.filter(x=>x.priority==='medium' && !x.completed && isToday(x.created_at)).length},
    {key:'low',    label:t('priority.lowLabel'),  color:'var(--sky)',     colorHex:'#5ac8fa',
      total: State.tasks.filter(x=>x.priority==='low' && !x.completed).length,
      today: State.tasks.filter(x=>x.priority==='low' && !x.completed && isToday(x.created_at)).length},
    {key:'done',   label:t('priority.doneLabel'),       color:'var(--emerald)', colorHex:'#34d399',
      total: State.tasks.filter(x=>x.completed).length,
      today: State.tasks.filter(x=>x.completed && isToday(x.completed_at)).length},
  ];

  // 4 равных сектора по 25% (ровно по ТЗ) — окружность разбита на 4 дуги
  // одинаковой длины, независимо от фактического соотношения данных.
  const R = 75, C = 2*Math.PI*R, GAP = 6;
  const segLen = C/4 - GAP;
  let svgSegs = '';
  groups.forEach((g,i)=>{
    const offset = -(i * (C/4));
    svgSegs += `<circle class="donut-seg" data-final="${segLen} ${C-segLen}" cx="90" cy="90" r="${R}" stroke="${g.colorHex}" stroke-dasharray="0 ${C}" stroke-dashoffset="${offset}"></circle>`;
  });

  const totalActive = State.tasks.filter(x=>!x.completed).length;

  wrap.innerHTML = `
    <div>
      <div class="donut-card-title">${escapeHtml(t('donut.title'))}</div>
      <div class="donut-card-sub">${escapeHtml(t('donut.sub'))}</div>
    </div>
    <div class="donut-svg-wrap">
      <svg viewBox="0 0 180 180">${svgSegs}</svg>
      <div class="donut-center">
        <div class="n display" id="donutCenterNum">0</div>
        <div class="l">${escapeHtml(t('donut.centerLabel'))}</div>
      </div>
    </div>
    <div class="donut-legend">
      ${groups.map(g=>`
        <div class="donut-legend-row">
          <span class="donut-legend-dot" style="background:${g.color};color:${g.color}"></span>
          <div class="donut-legend-txt">
            <span class="lbl">${escapeHtml(g.label)}</span>
            <span class="nums">${escapeHtml(t('donut.today'))}: <b class="cnt-today" data-target="${g.today}">0</b> · ${escapeHtml(t('donut.total'))}: <b class="cnt-total" data-target="${g.total}">0</b></span>
          </div>
        </div>`).join('')}
    </div>`;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      $$('.donut-seg', wrap).forEach(seg => { seg.setAttribute('stroke-dasharray', seg.dataset.final); });
      animateCount($('#donutCenterNum', wrap), totalActive, 900);
      $$('.cnt-today', wrap).forEach(node => animateCount(node, Number(node.dataset.target), 900));
      $$('.cnt-total', wrap).forEach(node => animateCount(node, Number(node.dataset.target), 900));
    });
  });

  return wrap;
}

function animateCount(node, target, duration){
  if(!node) return;
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    node.textContent = Math.round(eased * target);
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------------------
   10. Мутации задач (всё синхронно, всё пишется сразу в LocalStorage)
--------------------------------------------------------------------------- */
function toggleCompleted(tk){
  tk.completed = !tk.completed;
  tk.completed_at = tk.completed ? new Date().toISOString() : null;
  saveUserData();
  renderAll();
  toast(tk.completed ? t('task.done') : t('task.undone'), 'ok');
}

function toggleFavorite(tk){
  tk.is_favorite = !tk.is_favorite;
  saveUserData();
  renderAll();
}

function deleteTask(tk, cardEl){
  if(cardEl){ cardEl.classList.add('removing'); }
  State.tasks = State.tasks.filter(x=>x.id!==tk.id);
  saveUserData();
  setTimeout(()=>renderAll(), cardEl ? 260 : 0);
  toast(t('task.deleted'), 'ok');
}

--------------------------------------------------------------------------- */
let editingTaskId = null;

function fillCategorySelect(selectEl, currentId){
  selectEl.innerHTML = `<option value="">${escapeHtml(t('category.none'))}</option>` +
    State.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

function openTaskModal(task){
  editingTaskId = task ? task.id : null;
  $('#taskModalTitle').textContent = task ? t('task.editTitle') : t('task.newTitle');
  $('#tmSave').textContent = task ? t('task.save') : t('task.create');
  $('#tmDelete').style.display = task ? 'inline-flex' : 'none';
  $('#tmText').value = task ? task.text : '';
  fillCategorySelect($('#tmCategory'), task ? task.category_id : null);
  const pr = task ? task.priority : 'medium';
  $$('#tmPriority button').forEach(b=> b.classList.toggle('on', b.dataset.v===pr));
  $('#taskModal').classList.add('show');
  setTimeout(()=>$('#tmText').focus(), 50);
}
function closeTaskModal(){ $('#taskModal').classList.remove('show'); editingTaskId = null; }

function saveTaskModal(){
  const text = $('#tmText').value.trim();
  if(!text){ toast(t('task.needName'), 'warn'); $('#tmText').focus(); return; }
  const priority = $('#tmPriority').querySelector('.on').dataset.v;
  const catRaw = $('#tmCategory').value;
  const category_id = catRaw ? Number(catRaw) : null;

  if(editingTaskId){
    const tk = State.tasks.find(x=>x.id===editingTaskId);
    if(tk){ tk.text = text; tk.priority = priority; tk.category_id = category_id; }
    toast(t('task.updated'), 'ok');
  }else{
    State.tasks.unshift({
      id: uid(), text, priority, category_id,
      completed:false, is_favorite:false,
      created_at: new Date().toISOString(), completed_at: null,
    });
    toast(t('task.created'), 'ok');
  }
  saveUserData();
  closeTaskModal();
  renderAll();
}

function deleteFromModal(){
  if(!editingTaskId) return;
  const tk = State.tasks.find(x=>x.id===editingTaskId);
  closeTaskModal();
  if(tk) deleteTask(tk, null);
}

/* ---------------------------------------------------------------------------

function openCategoryModal(){
  $('#catName').value = '';
  $('#categoryModal').classList.add('show');
  setTimeout(()=>$('#catName').focus(), 50);
}
function saveCategoryModal(){
  const name = $('#catName').value.trim();
  if(!name){ toast(t('category.needName'), 'warn'); $('#catName').focus(); return; }
  State.categories.push({id: uid(), name});
  saveUserData();
  $('#categoryModal').classList.remove('show');
  toast(t('category.created'), 'ok');
  renderAll();
}

let pendingCategoryDelete = null;
function confirmDeleteCategory(c){
  pendingCategoryDelete = c;
  $('#confirmTitle').textContent = t('category.deleteTitle');
  $('#confirmText').textContent = t('category.deleteText', {name:c.name});
  $('#confirmModal').classList.add('show');
}
function performDeleteCategory(){
  if(!pendingCategoryDelete) return;
  const c = pendingCategoryDelete;
  $('#confirmModal').classList.remove('show');
  if(UIState.categoryId === c.id) UIState.categoryId = null;
  State.categories = State.categories.filter(x=>x.id!==c.id);
  State.tasks.forEach(tk => { if(tk.category_id===c.id) tk.category_id = null; });
  saveUserData();
  toast(t('category.deleted'), 'ok');
  renderAll();
  pendingCategoryDelete = null;
}

/* ---------------------------------------------------------------------------
   13. Общая проводка событий (вызывается один раз при загрузке)
--------------------------------------------------------------------------- */
function wireStaticEvents(){
  $('#phoneSubmit').onclick = submitPhoneStep;
  $('#phoneInput').addEventListener('keydown', e => { if(e.key==='Enter') submitPhoneStep(); });
  $('#codeBackBtn').onclick = () => { $('#loginStepCode').classList.remove('active'); $('#loginStepPhone').classList.add('active'); setTimeout(()=>$('#phoneInput').focus(),60); };
  $('#loginDebug').onclick = (e) => { e.preventDefault(); };

  $('#countrySelectBtn').onclick = (e) => { e.stopPropagation(); $('#countryDropdown').classList.toggle('show'); };
  document.addEventListener('click', (e) => { if(!e.target.closest('.country-select-wrap')) $('#countryDropdown').classList.remove('show'); });

  const codeInputs = $$('#codeInputs input');
  codeInputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g,'').slice(0,1);
      if(inp.value && idx < codeInputs.length-1) codeInputs[idx+1].focus();
      if(codeInputs.every(i=>i.value)) submitCodeStep();
    });
    inp.addEventListener('keydown', e => {
      if(e.key==='Backspace' && !inp.value && idx>0) codeInputs[idx-1].focus();
      if(e.key==='Enter') submitCodeStep();
    });
  });
  $('#codeSubmit').onclick = submitCodeStep;

  $$('.lang-switch').forEach(sw => {
    $$('button', sw).forEach(b => b.onclick = () => setLang(b.dataset.lang));
  });

  $('#allTasksNav').onclick = setActiveNavAllTasks;
  $('#favNav').onclick = () => { UIState.favOnly = !UIState.favOnly; renderAll(); };
  $('#btnAddCategory').onclick = openCategoryModal;

  $('#btnNewTask').onclick = () => openTaskModal(null);
  $('#tmSave').onclick = saveTaskModal;
  $('#tmDelete').onclick = deleteFromModal;
  $('#tmPriority').querySelectorAll('button').forEach(b => b.onclick = () => {
    $$('#tmPriority button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
  $('#tmText').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); saveTaskModal(); } });

  $('#catSave').onclick = saveCategoryModal;
  $('#catName').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); saveCategoryModal(); } });

  $('#confirmOk').onclick = performDeleteCategory;

  $$('.modal-backdrop').forEach(m => {
    m.addEventListener('mousedown', e => { if(e.target===m) m.classList.remove('show'); });
    m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => m.classList.remove('show'));
  });

  $('#btnLogout').onclick = logout;

  $('#btnMenu').onclick = () => { UIState.sidebarOpen = true; $('#sidebarLeft').classList.add('open'); $('#sidebarScrim').classList.add('show'); };
  $('#sidebarScrim').onclick = () => { UIState.sidebarOpen = false; $('#sidebarLeft').classList.remove('open'); $('#sidebarScrim').classList.remove('show'); };
  $('#sidebarLeft').addEventListener('click', (e) => {
    if(window.innerWidth <= 860 && e.target.closest('.side-item')){
      $('#sidebarLeft').classList.remove('open');
      $('#sidebarScrim').classList.remove('show');
    }
  });
}

/* ---------------------------------------------------------------------------
   14. Старт
--------------------------------------------------------------------------- */
boot();

})();
</script>
</body>
</html>
